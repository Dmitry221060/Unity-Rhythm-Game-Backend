name: CI tests workflow

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container: node:24-alpine
    services:
      db:
        image: mongo:4.1.8-xenial
        ports:
         - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongo --quiet \"localhost/test\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: db
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test:cov